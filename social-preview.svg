  <circle cx="1100" cy="160" r="2" fill="#8b5cf6" opacity="0.5"><animate attributeName="cy" values="160;140;160" dur="7s" repeatCount="indefinite" begin="1.5s"/></circle>
  <circle cx="250" cy="400" r="2" fill="#8b5cf6" opacity="0.5"><animate attributeName="cy" values="400;380;400" dur="9s" repeatCount="indefinite" begin="3s"/></circle>

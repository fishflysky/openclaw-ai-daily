<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Crescent moon -->
  <path d="M17 5 C12 5 10 8 10 16 C10 24 12 27 17 27 C15 25 14 20 14 16 C14 12 15 7 17 5Z" fill="url(#moonGrad)" opacity="0.95"/>

  <!-- Fish scales - overlapping arcs -->
  <g stroke="url(#scaleGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9">
    <!-- Row 1 -->
    <path d="M11 22 Q14 17 17 22"/>
    <path d="M16 22 Q19 17 22 22"/>
    <!-- Row 2 -->
    <path d="M13 26 Q16 21 19 26"/>
    <path d="M18 26 Q21 21 24 26"/>
  </g>
</svg>
